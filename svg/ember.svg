<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 3200" width="2400" height="3200">
  <defs>
    <filter id="painted" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8542e"/>
      <stop offset="100%" stop-color="#f0a050"/>
    </linearGradient>
    <clipPath id="upper"><rect x="0" y="0" width="2400" height="1880"/></clipPath>
  </defs>

  <rect width="2400" height="3200" fill="#2a0d10"/>
  <g filter="url(#painted)">
    <rect x="-100" y="-100" width="2600" height="1990" fill="url(#field)"/>
  </g>
  <g clip-path="url(#upper)">
    <circle cx="1200" cy="1880" r="620" fill="#ffd27a" opacity="0.45" filter="url(#soft)"/>
    <circle cx="1200" cy="1880" r="330" fill="#ffe0a0" opacity="0.5" filter="url(#soft)"/>
    <circle cx="1200" cy="1880" r="230" fill="#fff0c8" filter="url(#painted)"/>
  </g>
  <g filter="url(#painted)">
    <rect x="-100" y="1880" width="2600" height="1420" fill="#2a0d10"/>
    <rect x="1050" y="1930" width="300" height="10" rx="5" fill="#f0a050" opacity="0.35"/>
    <rect x="1120" y="1990" width="160" height="8" rx="4" fill="#f0a050" opacity="0.2"/>
  </g>

  <rect width="2400" height="3200" filter="url(#grain)" opacity="0.18"/>
</svg>
