<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 3200" width="2400" height="3200">
  <defs>
    <filter id="painted" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="3" seed="77" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b98580"/>
      <stop offset="100%" stop-color="#f0cdb4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3550"/>
      <stop offset="100%" stop-color="#161b2c"/>
    </linearGradient>
    <radialGradient id="sunBody" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e05a3a"/>
      <stop offset="100%" stop-color="#c23a26"/>
    </radialGradient>
  </defs>

  <rect width="2400" height="3200" fill="url(#dusk)"/>
  <circle cx="1200" cy="1950" r="760" fill="#f3b48e" opacity="0.35" filter="url(#soft)"/>
  <g filter="url(#painted)">
    <circle cx="1200" cy="1950" r="560" fill="url(#sunBody)"/>
    <rect x="-200" y="1950" width="2800" height="1400" fill="url(#sea)"/>
    <rect x="683" y="2040" width="980" height="30" rx="14" fill="#d9583a" opacity="0.80"/>
    <rect x="866" y="2150" width="760" height="27" rx="14" fill="#d9583a" opacity="0.71"/>
    <rect x="863" y="2280" width="600" height="24" rx="14" fill="#d9583a" opacity="0.62"/>
    <rect x="1010" y="2430" width="420" height="21" rx="14" fill="#d9583a" opacity="0.53"/>
    <rect x="1019" y="2600" width="280" height="18" rx="14" fill="#d9583a" opacity="0.44"/>
    <rect x="1095" y="2790" width="160" height="15" rx="14" fill="#d9583a" opacity="0.35"/>
    <rect x="1215" y="3000" width="70" height="12" rx="14" fill="#d9583a" opacity="0.26"/>
  </g>

  <rect width="2400" height="3200" filter="url(#grain)" opacity="0.18"/>
</svg>
