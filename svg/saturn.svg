<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 3200" width="2400" height="3200">
  <defs>
    <filter id="painted" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="3" seed="610" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
    <clipPath id="planet"><circle cx="1200" cy="1600" r="600"/></clipPath>
    <clipPath id="front"><rect x="-200" y="1600" width="2800" height="2000" transform="rotate(-14 1200 1600)"/></clipPath>
  </defs>

  <rect width="2400" height="3200" fill="#0d1020"/>
  <g filter="url(#painted)">
    <ellipse cx="1200" cy="1600" rx="1120" ry="291" fill="none" stroke="#c9a46a" stroke-width="90" transform="rotate(-14 1200 1600)"/>
    <ellipse cx="1200" cy="1600" rx="1010" ry="263" fill="none" stroke="#e3c88f" stroke-width="110" transform="rotate(-14 1200 1600)"/>
    <ellipse cx="1200" cy="1600" rx="925" ry="240" fill="none" stroke="#0d1020" stroke-width="24" transform="rotate(-14 1200 1600)"/>
    <ellipse cx="1200" cy="1600" rx="870" ry="226" fill="none" stroke="#b8915a" stroke-width="80" transform="rotate(-14 1200 1600)"/>
    <g clip-path="url(#planet)">
      <rect x="600" y="1000" width="1200" height="1200" fill="#d9a85e"/>
