      <path d="M 550 1150 L 1850 1150 L 1850 1300  L 550 1300 Z" fill="#d9a85e" transform="rotate(-14 1200 1600)"/>
      <path d="M 550 1300 L 1850 1300 L 1850 1450  L 550 1450 Z" fill="#c48a4a" transform="rotate(-14 1200 1600)"/>
      <path d="M 550 1450 L 1850 1450 L 1850 1600  L 550 1600 Z" fill="#e2bb78" transform="rotate(-14 1200 1600)"/>
      <path d="M 550 1600 L 1850 1600 L 1850 1750  L 550 1750 Z" fill="#b97a40" transform="rotate(-14 1200 1600)"/>
      <path d="M 550 1750 L 1850 1750 L 1850 1900  L 550 1900 Z" fill="#d29a56" transform="rotate(-14 1200 1600)"/>
      <path d="M 550 1900 L 1850 1900 L 1850 2050  L 550 2050 Z" fill="#a86a3a" transform="rotate(-14 1200 1600)"/>
      <path d="M 550 2050 L 1850 2050 L 1850 2200  L 550 2200 Z" fill="#c98e50" transform="rotate(-14 1200 1600)"/>
    </g>
    <g clip-path="url(#front)">
    <ellipse cx="1200" cy="1600" rx="1120" ry="291" fill="none" stroke="#c9a46a" stroke-width="90" transform="rotate(-14 1200 1600)"/>
