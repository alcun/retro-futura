<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 3200" width="2400" height="3200">
  <defs>
    <filter id="painted" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="3" seed="55" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
    <radialGradient id="sunBody" cx="42%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f5c865"/>
      <stop offset="100%" stop-color="#dc9a3a"/>
    </radialGradient>
  </defs>

  <rect width="2400" height="3200" fill="#ecdcbf"/>
  <circle cx="1650" cy="900" r="420" fill="#f0c070" opacity="0.3" filter="url(#soft)"/>
  <g filter="url(#painted)">
    <circle cx="1650" cy="900" r="230" fill="url(#sunBody)"/>
    <path d="M -200 1353 C 267 1353 267 1583 733 1583 C 1200 1583 1200 1559 1667 1559 C 2133 1559 2133 1491 2600 1491 L 2600 3400 L -200 3400 Z" fill="#9fa77c"/>
    <path d="M -200 1775 C 267 1775 267 2029 733 2029 C 1200 2029 1200 2035 1667 2035 C 2133 2035 2133 1905 2600 1905 L 2600 3400 L -200 3400 Z" fill="#6f7d55"/>
    <path d="M -200 2302 C 267 2302 267 2184 733 2184 C 1200 2184 1200 2081 1667 2081 C 2133 2081 2133 2243 2600 2243 L 2600 3400 L -200 3400 Z" fill="#b8643c"/>
    <path d="M -200 2738 C 267 2738 267 2510 733 2510 C 1200 2510 1200 2829 1667 2829 C 2133 2829 2133 2582 2600 2582 L 2600 3400 L -200 3400 Z" fill="#3f4a35"/>
  </g>

  <rect width="2400" height="3200" filter="url(#grain)" opacity="0.18"/>
</svg>
